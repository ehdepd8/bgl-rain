<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>BGL 역사 누수 관리 시스템</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }

    /* 상단 컨트롤 툴바 */
    #top-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: rgba(255, 255, 255, 0.96);
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      border: 1px solid #d0d7de;
      backdrop-filter: blur(6px);
      color: #24292f;
    }

    .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    
    select, button, label.btn-file {
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid #c8d1dc;
      background: #ffffff;
      color: #333333;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    select:focus, button:focus { outline: none; border-color: #007bff; }
    
    .btn-action {
      background: #0d6efd;
      border-color: #0d6efd;
      font-weight: bold;
      color: #ffffff;
    }
    .btn-action:hover { background: #0b5ed7; }
    .btn-action.active {
      background: #dc3545;
      border-color: #dc3545;
      animation: pulse-border 1.2s infinite;
      color: #ffffff;
    }

    .btn-sub { background: #eef2f6; font-size: 12px; padding: 6px 8px; border-color: #cfd8dc; }
    .btn-sub:hover { background: #e2e8f0; }

    /* 클라우드 동기화 뱃지 */
    .sync-status {
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
      background: #e6ffed;
      color: #1a7f37;
      border: 1px solid #a7f3d0;
      font-weight: bold;
    }

    /* 지도 캔버스 */
    #map { width: 100vw; height: 100vh; background: #ffffff; }

    /* 마커 스타일 */
    .leak-marker-node {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
    }
    .severity-high { background-color: #ef4444; animation: leak-pulse 1.4s infinite; }
    .severity-mid { background-color: #f59e0b; }
    .severity-low { background-color: #10b981; }

    @keyframes leak-pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(220, 53, 69, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
    }

    /* 사이드패널 */
    #side-panel {
      position: absolute;
      right: -320px;
      top: 65px;
      bottom: 20px;
      width: 300px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid #d0d7de;
      border-radius: 8px;
      box-shadow: -4px 0 16px rgba(0,0,0,0.15);
      z-index: 1000;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      color: #24292f;
    }
    #side-panel.open { right: 10px; }
    .panel-header {
      padding: 12px;
      border-bottom: 1px solid #e1e4e8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
    }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .leak-card {
      background: #f8fafc;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      border-left: 4px solid #0d6efd;
      border-top: 1px solid #e2e8f0;
      border-right: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      cursor: pointer;
    }
    .leak-card.high { border-left-color: #ef4444; }
    .leak-card.mid { border-left-color: #f59e0b; }
    .leak-card.low { border-left-color: #10b981; }

    /* 모달창 */
    #markerModal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #ffffff;
      color: #24292f;
      padding: 18px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      z-index: 2000;
      width: 90%;
      max-width: 340px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    #markerModal input, #markerModal select, #markerModal textarea {
      width: 100%;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #1e293b;
      font-size: 13px;
    }
    .modal-btns { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }

    /* 리플릿 팝업 커스텀 */
    .custom-popup-content { font-family: sans-serif; min-width: 150px; }
    .popup-actions { display: flex; gap: 5px; margin-top: 8px; }
    .popup-btn {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      color: #ffffff;
    }
    .popup-btn-edit { background: #0d6efd; }
    .popup-btn-del { background: #dc3545; }
  </style>
</head>
<body>

  <!-- 상단 컨트롤 툴바 -->
  <div id="top-bar">
    <div class="group">
      <select id="stationSelect">
        <option value="daejeo" selected>대저역</option>
        <option value="sasang">사상역</option>
        <option value="airport">공항역</option>
        <option value="kayadae">가야대역</option>
      </select>

      <select id="floorSelect">
        <option value="all">도면 전체</option>
        <option value="3f">지상3층 (승강장)</option>
        <option value="2f">지상2층 (대합실)</option>
      </select>

      <select id="cadThemeSelect">
        <option value="white" selected>도면 원본(화이트)</option>
        <option value="dark">CAD 다크</option>
        <option value="blueprint">청사진 (Blue)</option>
      </select>

      <span class="sync-status" id="syncStatus">● bgl-leak-tracker 연결됨</span>
    </div>

    <div class="group">
      <label class="btn-file" title="도면 파일 교체">
        📁 도면교체
        <input type="file" id="imageInput" accept="image/*" style="display:none;">
      </label>

      <button id="addMarkerBtn" class="btn-action">＋ 누수 마킹</button>
      <button id="toggleListBtn" class="btn-sub">📋 목록 (<span id="markerCountBadge">0</span>)</button>
    </div>
  </div>

  <!-- 지도 캔버스 -->
  <div id="map"></div>

  <!-- 누수 목록 사이드패널 -->
  <div id="side-panel">
    <div class="panel-header">
      <span>누수 개소 목록</span>
      <button id="closePanelBtn" style="border:none;background:none;color:#555;font-size:16px;cursor:pointer;">✕</button>
    </div>
    <div class="panel-body" id="leakListContainer">
      <div style="text-align:center;color:#888;margin-top:20px;">등록된 누수 개소가 없습니다.</div>
    </div>
  </div>

  <!-- 누수 등록/수정 모달창 -->
  <div id="markerModal">
    <h4 id="modalTitleText" style="font-size:15px; border-bottom:1px solid #e2e8f0; padding-bottom:6px;">누수 개소 등록</h4>
    <div>
      <label style="font-size:11px; color:#64748b;">구역/위치 명칭</label>
      <input type="text" id="modalTitle" placeholder="예: 3층 하행 승강장 2번 홈 천장">
    </div>
    <div>
      <label style="font-size:11px; color:#64748b;">심각도 (상태 색상)</label>
      <select id="modalSeverity">
        <option value="high">긴급 (뚝뚝 떨어짐 - 적색 점멸)</option>
        <option value="mid">주의 (벽면 번짐/결로 - 황색)</option>
        <option value="low">경미 (단순 습기 - 녹색)</option>
      </select>
    </div>
    <div>
      <label style="font-size:11px; color:#64748b;">조치/특이사항 메모</label>
      <textarea id="modalNote" rows="2" placeholder="조치 요청사항 입력"></textarea>
    </div>
    <div class="modal-btns">
      <button id="modalDeleteBtn" class="btn-sub" style="background:#fee2e2; color:#dc2626; border-color:#fca5a5; display:none;">삭제</button>
      <div style="display:flex; gap:6px; margin-left:auto;">
        <button id="modalCancelBtn" class="btn-sub">취소</button>
        <button id="modalSaveBtn" class="btn-action">저장</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase 모듈 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 새 프로젝트(bgl-leak-tracker) 설정값 적용
    const firebaseConfig = {
      apiKey: "AIzaSyBcxfuqLm49gfdQNTKhAm2GLD6y4g6KNmM",
      authDomain: "bgl-leak-tracker.firebaseapp.com",
      databaseURL: "https://bgl-leak-tracker-default-rtdb.firebaseio.com",
      projectId: "bgl-leak-tracker",
      storageBucket: "bgl-leak-tracker.firebasestorage.app",
      messagingSenderId: "89045969571",
      appId: "1:89045969571:web:3ed12ba2266c472ff8ad16",
      measurementId: "G-7BL1XL7YJR"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getDatabase(fbApp);

    // 요소 참조
    const stationSelect = document.getElementById('stationSelect');
    const floorSelect = document.getElementById('floorSelect');
    const cadThemeSelect = document.getElementById('cadThemeSelect');
    const addMarkerBtn = document.getElementById('addMarkerBtn');
    const toggleListBtn = document.getElementById('toggleListBtn');
    const sidePanel = document.getElementById('side-panel');
    const closePanelBtn = document.getElementById('closePanelBtn');
    const markerCountBadge = document.getElementById('markerCountBadge');
    const leakListContainer = document.getElementById('leakListContainer');

    const markerModal = document.getElementById('markerModal');
    const modalTitleText = document.getElementById('modalTitleText');
    const modalTitle = document.getElementById('modalTitle');
    const modalSeverity = document.getElementById('modalSeverity');
    const modalNote = document.getElementById('modalNote');
    const modalSaveBtn = document.getElementById('modalSaveBtn');
    const modalCancelBtn = document.getElementById('modalCancelBtn');
    const modalDeleteBtn = document.getElementById('modalDeleteBtn');

    // 대저역 평면도 해상도 (1231 x 860)
    let imgW = 1231;
    let imgH = 860;
    let bounds = [[0, 0], [imgH, imgW]];

    let isAddMode = false;
    let pendingLatLng = null;
    let editingFirebaseKey = null;
    let leakMarkers = [];
    let currentOverlay = null;
    let currentStation = stationSelect.value;

    // Leaflet 맵 초기화
    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -1.5,
      maxZoom: 3,
      zoomSnap: 0.1,
      attributionControl: false
    });
    map.fitBounds(bounds);

    // 테마 적용 (기본: 원본 화이트)
    function applyCadTheme() {
      const theme = cadThemeSelect ? cadThemeSelect.value : 'white';
      const mapEl = document.getElementById('map');
      const overlayEl = currentOverlay ? currentOverlay.getElement() : null;

      if (theme === 'dark') {
        mapEl.style.backgroundColor = '#121212';
        if (overlayEl) overlayEl.style.filter = 'invert(0.9) hue-rotate(180deg) brightness(1.2)';
      } else if (theme === 'blueprint') {
        mapEl.style.backgroundColor = '#0b2545';
        if (overlayEl) overlayEl.style.filter = 'invert(1) sepia(1) saturate(5) hue-rotate(175deg)';
      } else {
        mapEl.style.backgroundColor = '#ffffff';
        if (overlayEl) overlayEl.style.filter = 'none';
      }
    }

    // 도면 로드
    function loadPlanImage(src, w, h) {
      if (currentOverlay) map.removeLayer(currentOverlay);
      imgW = w || imgW;
      imgH = h || imgH;
      bounds = [[0, 0], [imgH, imgW]];

      currentOverlay = L.imageOverlay(src, bounds).addTo(map);
      map.fitBounds(bounds);
      map.setMaxBounds(bounds);
      setTimeout(applyCadTheme, 50);
    }

    loadPlanImage('daejeo.png', 1231, 860);

    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          loadPlanImage(evt.target.result, this.width, this.height);
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 마커 아이콘 생성
    function createLeakIcon(num, severity) {
      return L.divIcon({
        className: '',
        html: `<div class="leak-marker-node severity-${severity}">${num}</div>`,
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });
    }

    function updateMarkerPopup(item) {
      const popupHtml = `
        <div class="custom-popup-content">
          <h4 style="margin:0 0 4px 0; font-size:13px; color:#111;">No.${item.num} ${item.title}</h4>
          <p style="margin:0; font-size:12px; color:#555;">${item.note || '메모 없음'}</p>
          <div class="popup-actions">
            <button class="popup-btn popup-btn-edit" onclick="window.openEditModal('${item.fbKey}')">수정</button>
            <button class="popup-btn popup-btn-del" onclick="window.deleteMarkerByKey('${item.fbKey}')">삭제</button>
          </div>
        </div>
      `;
      item.markerObj.bindPopup(popupHtml);
    }

    // Firebase 실시간 동기화 수신
    function listenToStationLeaks(station) {
      const stationRef = ref(db, `leak_records/${station}`);
      onValue(stationRef, (snapshot) => {
        leakMarkers.forEach(m => map.removeLayer(m.markerObj));
        leakMarkers = [];

        const data = snapshot.val();
        if (data) {
          let num = 1;
          Object.keys(data).forEach((key) => {
            const val = data[key];
            const marker = L.marker([val.y, val.x], {
              icon: createLeakIcon(num, val.severity)
            }).addTo(map);

            const item = {
              fbKey: key,
              num: num,
              x: val.x,
              y: val.y,
              title: val.title,
              severity: val.severity,
              note: val.note,
              markerObj: marker
            };

            updateMarkerPopup(item);
            leakMarkers.push(item);
            num++;
          });
        }
        renderList();
      });
    }

    listenToStationLeaks(currentStation);

    stationSelect.addEventListener('change', (e) => {
      currentStation = e.target.value;
      listenToStationLeaks(currentStation);
    });

    // 목록 렌더링
    function renderList() {
      markerCountBadge.textContent = leakMarkers.length;
      if (leakMarkers.length === 0) {
        leakListContainer.innerHTML = '<div style="text-align:center;color:#888;margin-top:20px;">등록된 누수 개소가 없습니다.</div>';
        return;
      }

      leakListContainer.innerHTML = '';
      leakMarkers.forEach((item) => {
        const card = document.createElement('div');
        card.className = `leak-card ${item.severity}`;
        card.innerHTML = `
          <div style="font-weight:bold;margin-bottom:3px;color:#1e293b;">No.${item.num} - ${item.title}</div>
          <div style="color:#64748b;">${item.note || '특이사항 없음'}</div>
          <div style="font-size:10px;color:#94a3b8;margin-top:4px;">좌표: X ${Math.round(item.x)}, Y ${Math.round(item.y)}</div>
        `;
        card.addEventListener('click', () => {
          map.setView([item.y, item.x], 1);
          item.markerObj.openPopup();
        });
        leakListContainer.appendChild(card);
      });
    }

    // 마커 추가 토글
    addMarkerBtn.addEventListener('click', () => {
      isAddMode = !isAddMode;
      if (isAddMode) {
        addMarkerBtn.textContent = '도면 위치를 클릭하세요...';
        addMarkerBtn.classList.add('active');
      } else {
        addMarkerBtn.textContent = '＋ 누수 마킹';
        addMarkerBtn.classList.remove('active');
      }
    });

    map.on('click', function(e) {
      if (!isAddMode) return;

      editingFirebaseKey = null;
      pendingLatLng = e.latlng;

      modalTitleText.textContent = '누수 개소 신규 등록';
      modalTitle.value = '';
      modalNote.value = '';
      modalSeverity.value = 'high';
      modalDeleteBtn.style.display = 'none';

      markerModal.style.display = 'flex';
      modalTitle.focus();

      isAddMode = false;
      addMarkerBtn.textContent = '＋ 누수 마킹';
      addMarkerBtn.classList.remove('active');
    });

    // 수정/삭제 전역 함수
    window.openEditModal = function(key) {
      const item = leakMarkers.find(m => m.fbKey === key);
      if (!item) return;

      editingFirebaseKey = key;
      modalTitleText.textContent = `No.${item.num} 누수 개소 수정`;
      modalTitle.value = item.title;
      modalSeverity.value = item.severity;
      modalNote.value = item.note;
      modalDeleteBtn.style.display = 'inline-block';

      item.markerObj.closePopup();
      markerModal.style.display = 'flex';
      modalTitle.focus();
    };

    window.deleteMarkerByKey = function(key) {
      if (!confirm('해당 누수 개소를 삭제하시겠습니까?')) return;
      const targetRef = ref(db, `leak_records/${currentStation}/${key}`);
      remove(targetRef);
      markerModal.style.display = 'none';
    };

    // 모달 [저장]
    modalSaveBtn.addEventListener('click', () => {
      const title = modalTitle.value.trim() || '누수 점검 개소';
      const severity = modalSeverity.value;
      const note = modalNote.value.trim();

      if (editingFirebaseKey) {
        const targetRef = ref(db, `leak_records/${currentStation}/${editingFirebaseKey}`);
        update(targetRef, {
          title: title,
          severity: severity,
          note: note,
          updatedAt: new Date().toISOString()
        });
      } else if (pendingLatLng) {
        const stationRef = ref(db, `leak_records/${currentStation}`);
        const newRecordRef = push(stationRef);
        set(newRecordRef, {
          x: pendingLatLng.lng,
          y: pendingLatLng.lat,
          title: title,
          severity: severity,
          note: note,
          createdAt: new Date().toISOString()
        });
      }

      markerModal.style.display = 'none';
      pendingLatLng = null;
      editingFirebaseKey = null;
    });

    modalDeleteBtn.addEventListener('click', () => {
      if (editingFirebaseKey) {
        window.deleteMarkerByKey(editingFirebaseKey);
      }
    });

    modalCancelBtn.addEventListener('click', () => {
      markerModal.style.display = 'none';
      pendingLatLng = null;
      editingFirebaseKey = null;
    });

    // 테마 / 층수 / 사이드패널 이벤트
    cadThemeSelect.addEventListener('change', applyCadTheme);

    floorSelect.addEventListener('change', function(e) {
      const val = e.target.value;
      if (val === 'all') {
        map.fitBounds(bounds);
      } else if (val === '3f') {
        map.fitBounds([[480, 100], [820, 1150]]);
      } else if (val === '2f') {
        map.fitBounds([[50, 100], [450, 1150]]);
      }
    });

    toggleListBtn.addEventListener('click', () => sidePanel.classList.toggle('open'));
    closePanelBtn.addEventListener('click', () => sidePanel.classList.remove('open'));

    applyCadTheme();
  </script>
</body>
</html>
